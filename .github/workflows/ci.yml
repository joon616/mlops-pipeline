name: CI for Iris Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with: # fetches the full Git history for DVC
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          echo "$GCP_SA_KEY" > $RUNNER_TEMP/gcloud-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcloud-key.json

        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Fetch data & model from GCS
        run: |
          dvc pull -v

      - name: Run pytest and capture output
        run: |
          mkdir -p results
          pytest --maxfail=1 --disable-warnings -q > results/pytest.txt || true
        continue-on-error: false

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Create PR report
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # create a markdown report
          echo "## CI Test Report" > report.md
          echo '' >> report.md
          echo '### PyTest Output' >> report.md
          echo '```' >> report.md
          cat results/pytest.txt >> report.md
          echo '```' >> report.md
          echo '' >> report.md
          # attach junit xml as raw artifact (optional)
          # post comment using CML
          cml comment create --md report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
