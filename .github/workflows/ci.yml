name: CI for Iris Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with: # fetches the full Git history for DVC
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Authenticate GCP
        uses: 'google-github-actions/auth@v3'
        with:
          # should contain the entire JSON key content
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Setup DVC
        uses: iterative/setup-dvc@v2

      - name: Fetch data & model from GCS
        run: |
          dvc pull -v

      - name: Run pytest and capture output
        run: |
          mkdir -p results
          pytest -v --maxfail=1 --disable-warnings > results/pytest.txt || true

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Create PR report
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # create a markdown report
          echo "## CI Test Report" > report.md
          echo '' >> report.md
          echo '### PyTest Output' >> report.md
          echo '```' >> report.md
          cat results/pytest.txt >> report.md
          echo '```' >> report.md
          echo '' >> report.md
          # attach junit xml as raw artifact (optional)
          # post comment using CML
          cml comment create report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
